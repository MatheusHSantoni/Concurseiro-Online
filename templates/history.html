{% extends 'base.html' %}{% block content %}<h1>Histórico de desempenho</h1><div class="panel overflow"><table><thead><tr><th>Data</th><th>Disciplina</th><th>Questões</th><th>Acertos</th><th>%</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{r['day']}}</td><td>{{r['subject']}}</td><td>{{r['total']}}</td><td>{{r['hits']}}</td><td>{{(100*r['hits']/r['total'])|round(1)}}%</td></tr>{% else %}<tr><td colspan="5">Você ainda não respondeu questões.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
