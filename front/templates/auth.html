{% extends 'base.html' %}{% block content %}<div class="panel narrow"><h1>{{ 'Criar conta' if mode == 'register' else 'Entrar' }}</h1><form method="post"><input type="hidden" name="_csrf" value="{{ csrf() }}"><label>Usuário <input name="username" required minlength="3" maxlength="40" autocomplete="username"></label><label>Senha <input name="password" type="password" required minlength="8" autocomplete="{{ 'new-password' if mode == 'register' else 'current-password' }}"></label><button class="btn">{{ 'Cadastrar' if mode == 'register' else 'Entrar' }}</button></form><p><a href="{{ url_for('login' if mode == 'register' else 'register') }}">{{ 'Já tenho conta' if mode == 'register' else 'Criar uma conta' }}</a></p></div>{% endblock %}
